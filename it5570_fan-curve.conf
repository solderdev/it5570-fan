# /etc/modprobe.d/it5570_fan-curve.conf
# Installed there by `make dkms-install` (only if not already present);
# `make dkms-remove` deletes it only while it is still identical to the
# template in the repo.
#
# Persistent EC auto fan curve for the it5570_fan driver (LattePanda
# Sigma). The BIOS rewrites the EC's curve registers on every boot; with
# all four values set below, the driver re-applies your curve whenever
# the module loads - which modules-load.d does on every boot.
#
# The parameters are ignored (with a dmesg warning) unless ALL FOUR are
# set and valid:
#   - each value 0-255
#   - curve_start_pwm >= 26 (10 % floor for the curve's engaged duty;
#     below curve_start_temp - 5 the firmware still parks the fan at 0)
#   - curve_start_temp <= 100 (the EC temperature saturates at 100 °C;
#     a higher start temperature would keep the fan off forever)
#   - curve_start_pwm + (min(curve_full_temp, 101) - 1 - curve_start_temp)
#     * curve_slope <= 255 - otherwise the EC's duty target overflows a
#     byte and the fan would SLOW DOWN as the CPU heats up
#
# Curve model: duty/255 = start_pwm + (T - start_temp) * slope, jumping
# to 255 at full_temp. A full_temp above 100 is unreachable (the EC
# temperature saturates at 100 °C): it caps the curve instead - but it
# also disables that jump, which is the firmware's ONLY thermal-emergency
# path. You get the cap or the emergency full-speed net, never both; the
# reference tune below makes that trade deliberately, leaving CPU
# self-throttling at Tjmax as the backstop.
# Rule of thumb: RPM ≈ 12 * duty255 + 74.
#
# Reference tune (quiet: idle ~1000 RPM, sustained all-core ~2150 RPM,
# costs ~7 % sustained all-core clock):
#options it5570_fan curve_slope=2 curve_start_pwm=60 curve_start_temp=45 curve_full_temp=101
